name: zenart-stage0

x-backend-env: &backend-env
  ZENART_ENV: ${ZENART_ENV:-local}
  SERVICE_NAME: ${SERVICE_NAME:-zenart-backend}
  HTTP_ADDR: ${HTTP_ADDR:-:8080}
  HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
  DATABASE_URL: ${DATABASE_URL:-postgres://zenart:zenart@postgres:5432/zenart?sslmode=disable}
  POSTGRES_CHECK_TIMEOUT: ${POSTGRES_CHECK_TIMEOUT:-2s}
  REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_CHECK_TIMEOUT: ${REDIS_CHECK_TIMEOUT:-2s}
  OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-zenart-local}
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
  OBJECT_STORAGE_USE_SSL: ${OBJECT_STORAGE_USE_SSL:-false}
  OBJECT_STORAGE_LOCAL_ROOT: ${OBJECT_STORAGE_LOCAL_ROOT:-/var/lib/zenart/objectstore}
  OBJECT_STORAGE_SIGNING_KEY: ${OBJECT_STORAGE_SIGNING_KEY:-stage0-local-object-signing}
  OBJECT_STORAGE_CHECK_TIMEOUT: ${OBJECT_STORAGE_CHECK_TIMEOUT:-2s}
  STAGE0_ACCESS_MODE: ${STAGE0_ACCESS_MODE:-local}
  CHECKOUT_PROVIDER: ${CHECKOUT_PROVIDER:-mock}
  WEEKLY_QUOTA_UNITS: ${WEEKLY_QUOTA_UNITS:-1000}
  TASK_SCHEMA_VERSION: ${TASK_SCHEMA_VERSION:-1}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  CRAWLER_ENABLED: ${CRAWLER_ENABLED:-false}
  CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-ZenArtStage0Bot/0.1}
  CRAWLER_GLOBAL_RPS: ${CRAWLER_GLOBAL_RPS:-0.2}

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zenart}
      POSTGRES_USER: ${POSTGRES_USER:-zenart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zenart}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-zenart-local}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${OBJECT_STORAGE_BUCKET}"

  backend:
    build: *backend-build
    command: ["/app/server"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  worker:
    build: *backend-build
    command: ["/app/worker"]
    environment:
      <<: *backend-env
      SERVICE_NAME: zenart-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  crawler:
    build: *backend-build
    command: ["/app/crawler"]
    environment:
      <<: *backend-env
      SERVICE_NAME: zenart-crawler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    profiles: ["frontend"]
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      NEXT_PUBLIC_STAGE0_ACCESS_MODE: ${NEXT_PUBLIC_STAGE0_ACCESS_MODE:-local}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${WEB_PORT:-3000}:3000"

  admin:
    profiles: ["frontend"]
    build:
      context: ./admin
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_ADMIN_API_BASE_URL: ${NEXT_PUBLIC_ADMIN_API_BASE_URL:-http://localhost:8080}
      NEXT_PUBLIC_ADMIN_AUTH_MODE: ${NEXT_PUBLIC_ADMIN_AUTH_MODE:-local}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${ADMIN_PORT:-3001}:3000"

volumes:
  postgres-data:
  redis-data:
  minio-data:

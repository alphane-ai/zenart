name: zenart-stage0

x-backend-env: &backend-env
  ZENART_ENV: ${ZENART_ENV:-local}
  SERVICE_NAME: ${SERVICE_NAME:-zenart-backend}
  HTTP_ADDR: ${HTTP_ADDR:-:8080}
  HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
  CONTENT_SECURITY_POLICY: ${CONTENT_SECURITY_POLICY:-default-src 'none'; frame-ancestors 'none'; base-uri 'none'}
  CSRF_HEADER_NAME: ${CSRF_HEADER_NAME:-X-ZenArt-CSRF}
  CSRF_HEADER_VALUE: ${CSRF_HEADER_VALUE:-same-site-origin-check}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
  ALLOWED_UPLOAD_CONTENT_TYPES: ${ALLOWED_UPLOAD_CONTENT_TYPES:-image/png,image/jpeg,image/webp,image/gif,application/pdf}
  UPLOAD_URL_TTL: ${UPLOAD_URL_TTL:-10m}
  MALWARE_SCAN_PROVIDER: ${MALWARE_SCAN_PROVIDER:-stage0-placeholder}
  MALWARE_SCAN_ENDPOINT: ${MALWARE_SCAN_ENDPOINT:-}
  MALWARE_SCAN_API_KEY: ${MALWARE_SCAN_API_KEY:-}
  MALWARE_SCAN_TIMEOUT: ${MALWARE_SCAN_TIMEOUT:-5s}
  MALWARE_SCAN_FAIL_CLOSED: ${MALWARE_SCAN_FAIL_CLOSED:-false}
  DATABASE_URL: ${DATABASE_URL:-postgres://zenart:zenart@postgres:5432/zenart?sslmode=disable}
  POSTGRES_CHECK_TIMEOUT: ${POSTGRES_CHECK_TIMEOUT:-2s}
  REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_CHECK_TIMEOUT: ${REDIS_CHECK_TIMEOUT:-2s}
  OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-s3-compatible}
  OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
  OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-zenart-local}
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
  OBJECT_STORAGE_USE_SSL: ${OBJECT_STORAGE_USE_SSL:-false}
  OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
  OBJECT_STORAGE_LOCAL_ROOT: ${OBJECT_STORAGE_LOCAL_ROOT:-/var/lib/zenart/objectstore}
  OBJECT_STORAGE_SIGNING_KEY: ${OBJECT_STORAGE_SIGNING_KEY:-stage0-local-object-signing-key-32}
  OBJECT_STORAGE_DOWNLOAD_URL_TTL: ${OBJECT_STORAGE_DOWNLOAD_URL_TTL:-10m}
  OBJECT_STORAGE_CHECK_TIMEOUT: ${OBJECT_STORAGE_CHECK_TIMEOUT:-2s}
  WORKER_CLEANUP_INTERVAL: ${WORKER_CLEANUP_INTERVAL:-1h}
  WORKER_CLEANUP_TIMEOUT: ${WORKER_CLEANUP_TIMEOUT:-30s}
  WORKER_CLEANUP_BATCH_LIMIT: ${WORKER_CLEANUP_BATCH_LIMIT:-100}
  STAGE0_ACCESS_MODE: ${STAGE0_ACCESS_MODE:-local}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-__Host-zenart_session}
  SESSION_SECRET: ${SESSION_SECRET:-stage0-local-session-secret-minimum-32-bytes}
  SESSION_TTL: ${SESSION_TTL:-24h}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
  SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
  SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
  DEV_IDENTITY_HEADERS_ENABLED: ${DEV_IDENTITY_HEADERS_ENABLED:-true}
  ADMIN_DEV_IDENTITY_HEADERS_ENABLED: ${ADMIN_DEV_IDENTITY_HEADERS_ENABLED:-false}
  ADMIN_SESSION_COOKIE_NAME: ${ADMIN_SESSION_COOKIE_NAME:-__Host-zenart_admin_session}
  ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-stage0-local-admin-session-secret-minimum-32-bytes}
  ADMIN_SESSION_TTL: ${ADMIN_SESSION_TTL:-8h}
  LOCAL_SEED_USER_EMAIL: ${LOCAL_SEED_USER_EMAIL:-local.user@example.com}
  LOCAL_SEED_ADMIN_EMAIL: ${LOCAL_SEED_ADMIN_EMAIL:-local.admin@example.com}
  CHECKOUT_PROVIDER: ${CHECKOUT_PROVIDER:-mock}
  WEEKLY_QUOTA_UNITS: ${WEEKLY_QUOTA_UNITS:-1000}
  TASK_SCHEMA_VERSION: ${TASK_SCHEMA_VERSION:-1}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  CRAWLER_ENABLED: ${CRAWLER_ENABLED:-false}
  CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-ZenArtStage0Bot/0.1}
  CRAWLER_GLOBAL_RPS: ${CRAWLER_GLOBAL_RPS:-0.2}
  CRAWLER_SOURCE_RPS: ${CRAWLER_SOURCE_RPS:-0.1}
  CRAWLER_RAW_RETENTION_DAYS: ${CRAWLER_RAW_RETENTION_DAYS:-14}
  CRAWLER_BLOCKLIST_HOSTS: ${CRAWLER_BLOCKLIST_HOSTS:-localhost,127.0.0.1,169.254.169.254}
  METRICS_ENABLED: ${METRICS_ENABLED:-true}
  METRICS_PORT: ${METRICS_PORT:-9090}

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zenart}
      POSTGRES_USER: ${POSTGRES_USER:-zenart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zenart}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-zenart-local}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${OBJECT_STORAGE_BUCKET}"

  backend:
    build: *backend-build
    command: ["/app/server"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "${METRICS_PORT:-9090}:9090"

  worker:
    build: *backend-build
    command: ["/app/worker"]
    environment:
      <<: *backend-env
      SERVICE_NAME: zenart-worker
      METRICS_PORT: ${WORKER_METRICS_PORT:-9091}
      WORKER_CLEANUP_INTERVAL: ${WORKER_CLEANUP_INTERVAL:-1h}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${WORKER_METRICS_PORT:-9091}:${WORKER_METRICS_PORT:-9091}"

  crawler:
    build: *backend-build
    command: ["/app/crawler"]
    environment:
      <<: *backend-env
      SERVICE_NAME: zenart-crawler
      METRICS_PORT: ${CRAWLER_METRICS_PORT:-9092}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${CRAWLER_METRICS_PORT:-9092}:${CRAWLER_METRICS_PORT:-9092}"

  web:
    profiles: ["frontend"]
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      NEXT_PUBLIC_STAGE0_ACCESS_MODE: ${NEXT_PUBLIC_STAGE0_ACCESS_MODE:-local}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${WEB_PORT:-3000}:3000"

  admin:
    profiles: ["frontend"]
    build:
      context: ./admin
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_ADMIN_API_BASE_URL: ${NEXT_PUBLIC_ADMIN_API_BASE_URL:-http://localhost:8080}
      NEXT_PUBLIC_ADMIN_AUTH_MODE: ${NEXT_PUBLIC_ADMIN_AUTH_MODE:-local}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${ADMIN_PORT:-3001}:3000"

volumes:
  postgres-data:
  redis-data:
  minio-data:

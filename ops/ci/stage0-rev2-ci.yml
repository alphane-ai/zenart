name: Stage 0 Rev2 CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stage0-rev2-${{ github.ref }}
  cancel-in-progress: true

env:
  ZENART_ENV: CI
  PROVIDER_MODE: dev
  CHECKOUT_PROVIDER: mock
  STAGE0_ACCESS_MODE: local
  DATABASE_URL: postgres://zenart:zenart@localhost:5432/zenart?sslmode=disable
  REDIS_ADDR: localhost:6379
  OBJECT_STORAGE_ENDPOINT: http://localhost:9000
  OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
  OBJECT_STORAGE_BUCKET: zenart-ci
  OBJECT_STORAGE_ACCESS_KEY: minioadmin
  OBJECT_STORAGE_SECRET_KEY: minioadmin

jobs:
  repo-contracts:
    name: Repo contracts and generated artifacts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zenart
          POSTGRES_USER: zenart
          POSTGRES_PASSWORD: zenart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zenart -d zenart"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      minio:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "mc ready local || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate compose and CI draft syntax
        run: |
          docker compose --env-file .env.example config --quiet
          ruby -e "require 'yaml'; YAML.load_file('docker-compose.yml'); YAML.load_file('ops/ci/stage0-rev2-ci.yml')"

      - name: Validate generated OpenAPI clients are current
        run: python3 scripts/generate_openapi_clients.py --check

      - name: Validate Stage 0 Rev2 contract evidence
        run: python3 scripts/validate_stage0_rev2.py

      - name: Backend fmt, vet, unit, integration, and build
        working-directory: backend
        run: |
          test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          go test ./...
          go vet ./...
          go build ./cmd/server ./cmd/worker ./cmd/crawler ./cmd/migrate

      - name: Web lint, typecheck, unit, and build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run smoke:user-routes

      - name: Admin lint, typecheck, unit, and build
        working-directory: admin
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Script syntax validation
        run: |
          bash -n scripts/repo_validate.sh
          bash -n scripts/load_smoke.sh
          bash -n scripts/backup_restore_drill.sh
          bash -n scripts/playwright_smoke.sh
          bash -n scripts/docker_build_smoke.sh
          bash -n scripts/staging_smoke.sh
          bash -n scripts/observability_smoke.sh
          bash -n scripts/staging_observability_backup_load_smoke.sh
          bash -n scripts/staging_object_storage_signed_url_smoke.sh
          bash -n scripts/security_scan_smoke.sh
          DRY_RUN=1 scripts/playwright_smoke.sh
          DRY_RUN=1 scripts/docker_build_smoke.sh
          DRY_RUN=1 scripts/staging_smoke.sh
          DRY_RUN=1 scripts/observability_smoke.sh
          scripts/staging_observability_backup_load_smoke.sh || test "$?" = 2
          RUN_ID=ci-object-storage-signed-url scripts/staging_object_storage_signed_url_smoke.sh
          DRY_RUN=1 scripts/security_scan_smoke.sh

      - name: Secret scan smoke
        run: |
          ! git grep -nE '(AWS_SECRET_ACCESS_KEY|OPENAI_API_KEY|sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9_]{20,})' -- . ':!.env.example' ':!fixtures' ':!schemas' ':!ops/ci/stage0-rev2-ci.yml' ':!scripts/repo_validate.sh'

  docker-images:
    name: Docker image build draft
    runs-on: ubuntu-latest
    needs: repo-contracts
    strategy:
      matrix:
        image:
          - name: backend
            context: backend
          - name: web
            context: web
          - name: admin
            context: admin
    steps:
      - uses: actions/checkout@v4

      - name: Build SHA-tagged image
        run: docker build --tag ghcr.io/alphane-ai/zenart-${{ matrix.image.name }}:${{ github.sha }} ${{ matrix.image.context }}

  playwright-smoke:
    name: Playwright smoke draft
    runs-on: ubuntu-latest
    needs: repo-contracts
    steps:
      - uses: actions/checkout@v4

      - name: Run Playwright smoke wrapper in planned mode
        run: DRY_RUN=1 scripts/playwright_smoke.sh

  smoke-placeholders:
    name: Deferred smoke gates
    runs-on: ubuntu-latest
    needs: repo-contracts
    steps:
      - uses: actions/checkout@v4

      - name: Record token-blocked installation and deferred runtime smoke
        run: |
          test -f ops/evidence/stage0_environment_evidence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("ops/evidence/stage0_environment_evidence.json").read_text())
          blocked = [item for item in data["open_items"] if item["id"] == "install_github_actions_workflow"]
          assert blocked and blocked[0]["status"] == "blocked_by_token_scope"
          deferred = {item["id"] for item in data["open_items"]}
          assert "playwright_smoke" in deferred
          assert "runtime_load_drills" in deferred
          PY

    EvalResult:
      type: object
      description: Stored eval result projection from eval_results.summary, runner, and storage contract columns; admin reads expose replay provenance, source fixture digests, QA/export gates, and trace contracts without re-running the eval suite.
      required: [result_id, suite_id, subject, status, completed_at, created_at, summary, fixture_results, runner_contract, storage_contract]
      properties:
        result_id:
          type: string
        suite_id:
          type: string
        subject:
          type: object
          required: [subject_type, subject_id, version, candidate_status_after_eval]
          properties:
            subject_type:
              type: string
              enum: [skill_version, prompt_fragment, prompt_mutation, meta_prompt, image_spec, vertical_workflow_pack]
            subject_id:
              type: string
            version:
              type: string
            candidate_status_after_eval:
              type: string
              enum: [draft, eligible_for_canary, eligible_for_active, blocked]
        status:
          type: string
          enum: [pass, fail, blocked]
        completed_at:
          type: string
          format: date-time
          description: Completion timestamp persisted in eval_results.completed_at and used for latest-result ordering.
        created_at:
          type: string
          format: date-time
          description: Storage insertion timestamp persisted in eval_results.created_at.
        summary:
          type: object
          required:
            - total_fixtures
            - passed_fixtures
            - failed_fixtures
            - blocked_fixtures
            - golden_passed
            - critical_safety_regressions
            - regression_pass_rate
            - trace_complete
            - export_contract_complete
            - qa_fixture_coverage_complete
            - qa_categories_covered
            - safety_enforcement_points_covered
          properties:
            total_fixtures:
              type: integer
            passed_fixtures:
              type: integer
            failed_fixtures:
              type: integer
            blocked_fixtures:
              type: integer
            golden_passed:
              type: boolean
            critical_safety_regressions:
              type: integer
            regression_pass_rate:
              type: number
              minimum: 0
              maximum: 1
            trace_complete:
              type: boolean
            export_contract_complete:
              type: boolean
            qa_fixture_coverage_complete:
              type: boolean
            qa_categories_covered:
              type: array
              uniqueItems: true
              items:
                type: string
                enum:
                  - file_integrity
                  - dimensions
                  - aspect_ratio
                  - safe_area
                  - blank_output
                  - duplicate_similarity
                  - four_option_distinctness
                  - text_readability
                  - structured_text
                  - product_logo_preservation
                  - forbidden_claims
                  - watermark_signature_risk
                  - export_completeness
            safety_enforcement_points_covered:
              type: array
              uniqueItems: true
              items:
                type: string
                enum: [brief, provider_request, provider_response, qa, export]
        fixture_results:
          type: array
          description: Per-fixture stored gate projection. Each item exposes safety, QA coverage, trace completeness, export completeness, and QA export gate fields directly from the persisted eval result summary.
          items:
            type: object
            required:
              - fixture_id
              - category
              - workflow
              - status
              - candidate_count
              - expected_safety_action
              - observed_safety_action
              - safety_decision_contract
              - qa_check_ids
              - qa_coverage_contract
              - trace_contract
              - export_contract
              - qa_export_gate
              - failure_reasons
            properties:
              fixture_id:
                type: string
              category:
                type: string
                enum: [golden, ambiguous_brief, unsafe, negative, brand_product_preservation, text_heavy, export_completeness, regression, red_team]
              workflow:
                type: string
              status:
                type: string
                enum: [pass, fail, blocked]
              candidate_count:
                type: integer
              expected_safety_action:
                type: string
                enum: [allow, warn, require_user_confirmation, require_admin_review, block]
              observed_safety_action:
                type: string
                enum: [allow, warn, require_user_confirmation, require_admin_review, block]
              safety_decision_contract:
                type: object
                required:
                  - decision
                  - decision_source
                  - source_rule_ids
                  - enforcement_points
                  - trace_status_required
                  - persisted_decision_required
                  - audit_required
                  - export_gate_effect
                properties:
                  decision:
                    type: string
                    enum: [allow, warn, require_user_confirmation, require_admin_review, block]
                  decision_source:
                    type: string
                    enum: [default_no_match, linked_safety_rule]
                  source_rule_ids:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                  enforcement_points:
                    type: array
                    minItems: 5
                    maxItems: 5
                    uniqueItems: true
                    items:
                      type: string
                      enum: [brief, provider_request, provider_response, qa, export]
                  trace_status_required:
                    type: boolean
                    const: true
                  persisted_decision_required:
                    type: boolean
                    const: true
                  audit_required:
                    type: boolean
                  export_gate_effect:
                    type: string
                    enum: [allow_when_export_contract_complete, allow_with_warning, hold_until_user_confirmation, hold_until_admin_review, block_final_export]
              qa_check_ids:
                type: array
                items:
                  type: string
              qa_coverage_contract:
                type: object
                required: [expected_qa_categories, observed_qa_categories, missing_qa_categories, workflow_required_qa_categories, coverage_complete]
                properties:
                  expected_qa_categories:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      enum: [file_integrity, dimensions, aspect_ratio, safe_area, blank_output, duplicate_similarity, four_option_distinctness, text_readability, structured_text, product_logo_preservation, forbidden_claims, watermark_signature_risk, export_completeness]
                  observed_qa_categories:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      enum: [file_integrity, dimensions, aspect_ratio, safe_area, blank_output, duplicate_similarity, four_option_distinctness, text_readability, structured_text, product_logo_preservation, forbidden_claims, watermark_signature_risk, export_completeness]
                  missing_qa_categories:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      enum: [file_integrity, dimensions, aspect_ratio, safe_area, blank_output, duplicate_similarity, four_option_distinctness, text_readability, structured_text, product_logo_preservation, forbidden_claims, watermark_signature_risk, export_completeness]
                  workflow_required_qa_categories:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      enum: [file_integrity, dimensions, aspect_ratio, safe_area, blank_output, duplicate_similarity, four_option_distinctness, text_readability, structured_text, product_logo_preservation, forbidden_claims, watermark_signature_risk, export_completeness]
                  coverage_complete:
                    type: boolean
              trace_contract:
                type: object
                required: [trace_id, has_schema_validation, has_provenance, has_safety_status, has_qa_eval_status, has_quota_transaction, has_admin_visibility, has_user_failure_mapping]
                properties:
                  trace_id:
                    type: string
                  has_schema_validation:
                    type: boolean
                    const: true
                  has_provenance:
                    type: boolean
                    const: true
                  has_safety_status:
                    type: boolean
                    const: true
                  has_qa_eval_status:
                    type: boolean
                    const: true
                  has_quota_transaction:
                    type: boolean
                    const: true
                  has_admin_visibility:
                    type: boolean
                    const: true
                  has_user_failure_mapping:
                    type: boolean
                    const: true
              export_contract:
                type: object
                required: [manifest, qa_report, metadata, trace_provenance, safety_disclaimer_when_applicable, blocks_when_incomplete]
                properties:
                  manifest:
                    type: boolean
                  qa_report:
                    type: boolean
                  metadata:
                    type: boolean
                  trace_provenance:
                    type: boolean
                  safety_disclaimer_when_applicable:
                    type: boolean
                  blocks_when_incomplete:
                    type: boolean
                    const: true
              qa_export_gate:
                type: object
                required: [final_export_allowed, blocking_qa_check_ids, blocking_qa_categories, safety_blocks_export, export_artifacts_complete, denial_reasons, admin_override_required_for_export, override_requires_audit]
                properties:
                  final_export_allowed:
                    type: boolean
                  blocking_qa_check_ids:
                    type: array
                    items:
                      type: string
                  blocking_qa_categories:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      enum:
                        - file_integrity
                        - dimensions
                        - aspect_ratio
                        - safe_area
                        - blank_output
                        - duplicate_similarity
                        - four_option_distinctness
                        - text_readability
                        - structured_text
                        - product_logo_preservation
                        - forbidden_claims
                        - watermark_signature_risk
                        - export_completeness
                  safety_blocks_export:
                    type: boolean
                  export_artifacts_complete:
                    type: boolean
                  denial_reasons:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      enum:
                        - blocking_qa
                        - safety_policy_block
                        - safety_user_confirmation_required
                        - safety_admin_review_required
                        - incomplete_export_artifacts
                        - qa_coverage_incomplete
                  admin_override_required_for_export:
                    type: boolean
                  override_requires_audit:
                    type: boolean
                    const: true
              failure_reasons:
                type: array
                items:
                  type: string
        storage_contract:
          type: object
          description: Stored eval_results contract projected with the result so admin reads can verify immutability, idempotent replay, retention, and read_without_eval_rerun behavior.
          required:
            - table
            - required_columns
            - required_indexes
            - required_query_filters
            - tenant_scoped
            - subject_scoped
            - summary_json_contains_fixture_results
            - summary_projection_fields
            - fixture_result_projection_fields
            - admin_read_projection_required
            - read_without_eval_rerun
            - latest_result_resolvable
            - immutable_rows
            - idempotent_replay_key
            - idempotent_replay_conflict_policy
            - no_public_delete_operation
            - retention_contract
          properties:
            table:
              type: string
              const: eval_results
            required_columns:
              type: array
              uniqueItems: true
              items:
                type: string
                enum: [id, tenant_id, eval_suite_id, subject_type, subject_id, subject_version, status, summary, runner, runner_sha256, completed_at, created_at]
            required_indexes:
              type: array
              uniqueItems: true
              items:
                type: string
                enum: [idx_eval_results_tenant_suite_subject_created_at, idx_eval_results_subject_status_completed_at]
            required_query_filters:
              type: array
              uniqueItems: true
              items:
                type: string
                enum: [tenant_id, eval_suite_id, subject_type, subject_id, subject_version, status, completed_after, latest_only]
            tenant_scoped:
              type: boolean
              const: true
            subject_scoped:
              type: boolean
              const: true
            summary_json_contains_fixture_results:
              type: boolean
              const: true
            summary_projection_fields:
              type: array
              description: Persisted summary fields that admin reads can render without re-running the eval suite.
              minItems: 13
              uniqueItems: true
              items:
                type: string
                enum:
                  - total_fixtures
                  - passed_fixtures
                  - failed_fixtures
                  - blocked_fixtures
                  - golden_passed
                  - critical_safety_regressions
                  - regression_pass_rate
                  - trace_complete
                  - export_contract_complete
                  - qa_fixture_coverage_complete
                  - qa_categories_covered
                  - safety_enforcement_points_covered
            fixture_result_projection_fields:
              type: array
              description: Persisted per-fixture fields that expose QA, trace, export, and safety gate evidence from summary JSON.
              minItems: 12
              uniqueItems: true
              items:
                type: string
                enum:
                  - fixture_id
                  - category
                  - workflow
                  - status
                  - expected_safety_action
                  - observed_safety_action
                  - safety_decision_contract
                  - qa_check_ids
                  - qa_coverage_contract
                  - trace_contract
                  - export_contract
                  - qa_export_gate
                  - failure_reasons
            admin_read_projection_required:
              type: boolean
              const: true
            read_without_eval_rerun:
              type: boolean
              const: true
            latest_result_resolvable:
              type: boolean
              description: Read APIs can resolve latest results by completed_at desc with created_at desc tie-break.
              const: true
            immutable_rows:
              type: boolean
              description: Eval result rows are immutable; replays create or resolve idempotent rows instead of overwriting history.
              const: true
            idempotent_replay_key:
              type: array
              uniqueItems: true
              items:
                type: string
                enum: [tenant_id, eval_suite_id, subject_type, subject_id, subject_version, runner_sha256]
            idempotent_replay_conflict_policy:
              type: object
              description: Exact deterministic replay returns an existing immutable row, divergent same-key replay is rejected for admin audit, and same subject across another tenant inserts a separate row.
              required:
                - exact_replay_returns_existing_row
                - same_key_different_result_rejected
                - same_subject_other_tenant_inserts_new_row
                - conflict_requires_admin_audit
                - blocked_conflict_denies_activation
              properties:
                exact_replay_returns_existing_row:
                  type: boolean
                  const: true
                same_key_different_result_rejected:
                  type: boolean
                  const: true
                same_subject_other_tenant_inserts_new_row:
                  type: boolean
                  const: true
                conflict_requires_admin_audit:
                  type: boolean
                  const: true
                blocked_conflict_denies_activation:
                  type: boolean
                  const: true
            retention_contract:
              type: object
              description: Eval result retention policy keeps pass, fail, and blocked result history readable without reruns and requires admin audit for deletion or redaction.
              required:
                - retain_pass_fail_blocked_results
                - retain_summary_json
                - retain_runner_hash
                - deletion_requires_admin_audit
                - redaction_requires_admin_audit
                - no_public_delete_operation
                - minimum_retention_days
              properties:
                retain_pass_fail_blocked_results:
                  type: boolean
                  const: true
                retain_summary_json:
                  type: boolean
                  const: true
                retain_runner_hash:
                  type: boolean
                  const: true
                deletion_requires_admin_audit:
                  type: boolean
                  const: true
                redaction_requires_admin_audit:
                  type: boolean
                  const: true
                no_public_delete_operation:
                  type: boolean
                  const: true
                minimum_retention_days:
                  type: integer
                  minimum: 365
            no_public_delete_operation:
              type: boolean
              const: true
        runner_contract:
          type: object
          description: Deterministic replay provenance projected with the result, including the runner hash and source_fixture_digests used to decide whether stored eval evidence is stale.
          required: [runner, runner_sha256, deterministic_replay_command, writes_stored_fixture, check_mode_compares_exact_json, source_fixture_digests]
          properties:
            runner:
              type: string
              const: scripts/run_stage0_eval.py
            runner_sha256:
              type: string
              pattern: "^[a-f0-9]{64}$"
            deterministic_replay_command:
              type: string
              const: python3 scripts/run_stage0_eval.py --check
            writes_stored_fixture:
              type: boolean
              const: true
            check_mode_compares_exact_json:
              type: boolean
              const: true
            source_fixture_digests:
              type: array
              description: SHA-256 digests for every source fixture used by deterministic replay.
              minItems: 7
              uniqueItems: true
              items:
                type: object
                required: [path, sha256]
                properties:
                  path:
                    type: string
                    pattern: "^(fixtures/stage0/rev2/eval/(starter_eval_suite|qa_results|safety_rules)\\.json|fixtures/stage0/rev2/workflows/[a-z0-9_]+\\.json)$"
                    description: "Exact Stage 0 Rev2 replay sources: fixtures/stage0/rev2/eval/starter_eval_suite.json, fixtures/stage0/rev2/eval/qa_results.json, fixtures/stage0/rev2/eval/safety_rules.json, fixtures/stage0/rev2/workflows/business_visual_doc_pack.json, fixtures/stage0/rev2/workflows/character_ip_concept_pack.json, fixtures/stage0/rev2/workflows/ecommerce_growth_pack.json, and fixtures/stage0/rev2/workflows/local_merchant_campaign_pack.json."
                  sha256:
                    type: string
                    pattern: "^[a-f0-9]{64}$"
    EvalResultArtifact:
      type: object
      required:
        - result_id
        - tenant_id
        - suite_id
        - subject
        - status
        - completed_at
        - object_key
        - content_type
        - sha256
        - artifact_links
        - download_url
        - expires_at
        - access_policy
        - audit_required
      properties:
        result_id:
          type: string
        tenant_id:
          type: string
          description: Required admin tenant scope for eval artifact retrieval.
        suite_id:
          type: string
        subject:
          type: object
          required: [subject_type, subject_id, version]
          properties:
            subject_type:
              type: string
              enum: [skill_version, prompt_fragment, prompt_mutation, meta_prompt, image_spec, vertical_workflow_pack]
            subject_id:
              type: string
            version:
              type: string
        status:
          type: string
          enum: [pass, fail, blocked]
        completed_at:
          type: string
          format: date-time
        object_key:
          type: string
          description: Tenant-scoped stored eval result JSON artifact key.
        content_type:
          type: string
          const: application/json
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        artifact_links:
          type: array
          minItems: 5
          uniqueItems: true
          items:
            type: string
            enum:
              - eval_result_json
              - summary_json
              - fixture_results_json
              - source_fixture_digests_json
              - runner_manifest_json
              - qa_results_json
              - safety_decisions_json
              - trace_export_gate_matrix_json
        download_url:
          type: string
          format: uri
          description: Short-lived signed admin URL; direct object access remains denied.
        expires_at:
          type: string
          format: date-time
        access_policy:
          type: object
          required: [direct_object_access_allowed, audit_access_required, max_expires_in_seconds]
          properties:
            direct_object_access_allowed:
              type: boolean
              const: false
            audit_access_required:
              type: boolean
              const: true
            max_expires_in_seconds:
              type: integer
              maximum: 900
        audit_required:
          type: boolean
          const: true

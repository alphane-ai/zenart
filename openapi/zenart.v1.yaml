              - trace_missing_safety_decision_ref
              - trace_missing_qa_result_ref
              - trace_missing_eval_result_ref
              - trace_tenant_mismatch
        audit_event_required:
          type: boolean
          description: True for blocked export attempts that must be visible to support/admin audit.
        download_url:
          type: string
          format: uri
          nullable: true
          description: Short-lived signed URL for export download when the object is ready.

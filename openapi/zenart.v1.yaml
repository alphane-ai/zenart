          type: string
          description: Production-like versioning or equivalent restore requirement for object storage buckets.
        retention_until:
          type: string
          description: Required retention marker propagated to export objects before audited cleanup.
        tenant:
          type: string
        cleanup_modes:
          type: array
          minItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [expired export cleanup, orphan cleanup]
        audit_resource:
          type: string
          enum: [object_storage_cleanup]
        release_gate_check:
          type: string
          enum: [staging_object_storage_signed_downloads]
        checked_at:
          type: string
          format: date-time

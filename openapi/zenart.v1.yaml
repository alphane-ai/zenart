          type: boolean
          description: True only when eval, QA, safety, trace, package, and artifact gates all allow download.
        download_enabled:
          type: boolean
          description: Mirrors final export eligibility and must be false when download_url is null.
        denial_reasons:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - blocking_qa
              - qa_coverage_incomplete
              - safety_policy_block
              - safety_user_confirmation_required
              - safety_admin_review_required
              - incomplete_export_artifacts
              - eval_not_passed
              - package_readiness_denied
              - trace_incomplete

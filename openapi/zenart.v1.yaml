components:
  securitySchemes:
    ZenArtSession:
      type: apiKey
      in: header
      name: X-Zenart-User-ID
      description: Stage 0 local session header. Production auth must replace this with signed session validation.
  parameters:
    PageToken:
      name: page_token
      in: query
      schema:
        type: string
      description: Cursor token returned by the previous page.
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Maximum records to return.
    Sort:
      name: sort
      in: query
      schema:
        type: string
        example: "-created_at"
      description: Comma-separated sort keys. Prefix with - for descending.
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 200

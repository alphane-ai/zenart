  /session:
    get:
      operationId: getSession
      tags: [auth]
      x-rbac: user
      responses:
        "200":
          description: Active user session and account state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSession
      tags: [auth]
      x-rbac: user
      responses:
        "204":
          description: Session revoked.
        default:
          $ref: "#/components/responses/Error"

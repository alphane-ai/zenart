          minimum: 0
        orphaned_objects:
          type: integer
          minimum: 0
        deleted_objects:
          type: integer
          minimum: 0
        failed_objects:
          type: integer
          minimum: 0
        preview_objects:
          type: integer
          minimum: 0
        dry_run:
          type: boolean
        status:
          type: string
          enum: [preview, completed, partial_failed]
        mode:
          type: string
          enum: [expired_export_cleanup, orphan_cleanup, combined]
        retention_policy:
          type: string
          enum: [tenant scoped retention_until enforced before deletion]
        expired_export_cleanup:
          type: string
        orphan_cleanup:
          type: string
        retained:
          type: integer
          minimum: 0
        deleted:
          type: integer
          minimum: 0

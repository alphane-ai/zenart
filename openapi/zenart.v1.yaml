components:
  securitySchemes:
    ZenArtSession:
      type: apiKey
      in: header
      name: X-Zenart-User-ID
      description: Stage 0 local session header. Production auth must replace this with signed session validation.
  parameters:
    PageToken:
      name: page_token
      in: query
      schema:
        type: string
      description: Cursor token returned by the previous page.
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Maximum records to return.
    Sort:
      name: sort
      in: query
      schema:
        type: string
        example: "-created_at"
      description: Comma-separated sort keys. Prefix with - for descending.
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 200
      description: Search text applied to indexed text fields.
    StatusFilter:
      name: status
      in: query
      schema:
        type: string
      description: Filter by resource status.
    TenantIdFilter:
      name: tenant_id
      in: query
      required: true
      schema:
        type: string
      description: Required admin tenant scope for stored eval result reads.
    EvalSuiteIdFilter:
      name: eval_suite_id
      in: query
      schema:
        type: string
      description: Filter eval results by suite id.
    EvalSubjectTypeFilter:
      name: subject_type
      in: query
      schema:
        type: string
        enum: [skill_version, prompt_fragment, prompt_mutation, meta_prompt, image_spec, vertical_workflow_pack]
      description: Filter eval results by evaluated subject type.
    SubjectIdFilter:
      name: subject_id
      in: query
      schema:
        type: string
      description: Filter eval results by evaluated subject id.
    SubjectVersionFilter:
      name: subject_version
      in: query
      schema:
        type: string
      description: Filter eval results by evaluated subject version before latest-only grouping.
    CompletedAfterFilter:
      name: completed_after
      in: query
      schema:
        type: string
        format: date-time
      description: Return eval results completed after this timestamp.
    EvalLatestOnlyFilter:
      name: latest_only
      in: query
      schema:
        type: boolean
        default: false
      description: Return only the latest immutable eval result per tenant, suite, subject, version, and runner hash.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
      description: Required for mutating requests so retries are safe.
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
    ChatSessionId:
      name: chat_session_id
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
    CandidateSetId:
      name: candidate_set_id
      in: path
      required: true
      schema:
        type: string
    PackageId:
      name: package_id
      in: path
      required: true
      schema:
        type: string
    ExportId:
      name: export_id
      in: path
      required: true
      schema:
        type: string
    SkillId:
      name: skill_id
      in: path
      required: true
      schema:
        type: string
    TraceId:
      name: trace_id
      in: path
      required: true
      schema:
        type: string
    EvalResultId:
      name: result_id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Shared error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorEnvelope:
      type: object
      required: [code, message, request_id, details, field_errors]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
        field_errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
    PageInfo:
      type: object
      required: [next_page_token, total_count]
      properties:
        next_page_token:
          type: string
        total_count:
          type: integer
          minimum: 0
    Session:
      type: object
      required: [id, user, tenant_id, roles, expires_at]
      properties:
        id:
          type: string
        user:
          $ref: "#/components/schemas/User"
        tenant_id:
          type: string
        roles:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
    User:
      type: object
      required: [id, email, display_name]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
    Account:
      type: object
      required: [user, settings]
      properties:
        user:
          $ref: "#/components/schemas/User"
        settings:
          type: object
          additionalProperties: true
    AccountUpdate:
      type: object
      properties:
        display_name:
          type: string
        settings:
          type: object
          additionalProperties: true
    Project:
      type: object
      required: [id, tenant_id, owner_id, name, status, workflow_id, brief, created_at, updated_at]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        owner_id:
          type: string
        name:
          type: string
        status:
          type: string
        workflow_id:
          type: string
        brief:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectCreate:
      type: object
      required: [name, workflow_id]
      properties:
        name:
          type: string
        workflow_id:
          type: string
        brief:
          type: string
    ProjectUpdate:

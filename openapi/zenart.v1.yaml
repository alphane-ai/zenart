openapi: 3.1.0
info:
  title: ZenArt API
  version: 0.1.0-stage0-rev2
  description: Stage 0 Rev2 API contract. Docs/stage0_blueprint_rev2.md is authoritative.
servers:
  - url: /api/v1
    description: User API
  - url: /api/admin/v1
    description: Admin API
security:
  - ZenArtSession: []
tags:
  - name: auth
  - name: projects
  - name: workspace
  - name: chat
  - name: tasks
  - name: candidates
  - name: canvas
  - name: assets
  - name: packages
  - name: quota
  - name: support
  - name: exports
  - name: skills
  - name: crawler
  - name: prompts
  - name: providers
  - name: traces
  - name: feedback
  - name: safety
  - name: eval
  - name: abuse
  - name: analytics
  - name: audit
paths:
  /session:
    get:
      operationId: getSession
      tags: [auth]
      x-rbac: user
      responses:
        "200":
          description: Active user session and account state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSession
      tags: [auth]
      x-rbac: user
      responses:
        "204":
          description: Session revoked.
        default:
          $ref: "#/components/responses/Error"
  /account:
    get:
      operationId: getAccount
      tags: [auth]
      x-rbac: user
      responses:
        "200":
          description: Account settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAccount
      tags: [auth]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated account settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Error"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      x-rbac: user
      parameters:
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/StatusFilter"
      responses:
        "200":
          description: Project page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProject
      tags: [projects]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":

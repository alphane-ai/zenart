openapi: 3.1.0
info:
  title: ZenArt API
  version: 0.1.0-stage0-rev2
  description: Stage 0 Rev2 API contract. Docs/stage0_blueprint_rev2.md is authoritative.
servers:
  - url: /api/v1
    description: User API
  - url: /api/admin/v1
    description: Admin API
security:
  - ZenArtSession: []
tags:
  - name: auth
  - name: projects
  - name: workspace
  - name: chat
  - name: tasks
  - name: candidates
  - name: canvas
  - name: assets
  - name: packages
  - name: quota
  - name: support
  - name: skills
  - name: crawler
  - name: prompts
  - name: traces
  - name: feedback
  - name: safety
  - name: audit

openapi: 3.1.0
info:
  title: Zenari API
  version: 0.1.0-stage0-rev2
  description: Stage 0 Rev2 API contract. Docs/stage0_blueprint_rev2.md is authoritative.
servers:
  - url: /api/v1
    description: User API
  - url: /api/admin/v1
    description: Admin API
security:
  - ZenariSession: []
tags:
  - name: auth
  - name: projects
  - name: workspace
  - name: chat
  - name: tasks
  - name: candidates
  - name: canvas
  - name: assets
  - name: brand-kits
  - name: packages
  - name: quota
  - name: billing
  - name: teams
  - name: support
  - name: exports
  - name: object-storage
  - name: skills
  - name: crawler
  - name: prompts
  - name: providers
  - name: traces
  - name: feedback
  - name: safety
  - name: eval
  - name: abuse
  - name: analytics
  - name: audit
paths:
  /session:
    get:
      operationId: getSession
      tags: [auth]
      x-rbac: user
      responses:
        "200":
          description: Active user session and account state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSession
      tags: [auth]
      x-rbac: user
      responses:
        "204":
          description: Session revoked.
        default:
          $ref: "#/components/responses/Error"
  /account:
    get:
      operationId: getAccount
      tags: [auth]
      x-rbac: user
      responses:
        "200":
          description: Account settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAccount
      tags: [auth]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated account settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Error"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      x-rbac: user
      parameters:
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/StatusFilter"
      responses:
        "200":
          description: Project page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProject
      tags: [projects]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Created project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}:
    get:
      operationId: getProject
      tags: [projects]
      x-rbac: user
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProject
      tags: [projects]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/workspace:
    get:
      operationId: getWorkspace
      tags: [workspace]
      x-rbac: user
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Workspace state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/chat/sessions:
    post:
      operationId: createChatSession
      tags: [chat]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSessionCreate"
      responses:
        "201":
          description: Chat session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"
        default:
          $ref: "#/components/responses/Error"
  /chat/sessions/{chat_session_id}/messages:
    get:
      operationId: listChatMessages
      tags: [chat]
      x-rbac: user
      parameters:
        - $ref: "#/components/parameters/ChatSessionId"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Chat message page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessagePage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createChatMessage
      tags: [chat]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/ChatSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageCreate"
      responses:
        "202":
          description: Accepted agent task for message processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatus"
        default:
          $ref: "#/components/responses/Error"
  /tasks/{task_id}:
    get:
      operationId: getTask
      tags: [tasks]
      x-rbac: user
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Long-running task status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatus"
        "409":
          description: Task schema is newer than this API/worker deployment supports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/batch-generations:
    post:
      operationId: createBatchGeneration
      tags: [tasks]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchGenerationCreate"
      responses:
        "201":
          description: Batch generation request accepted with queued child tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGenerationRequest"
        default:
          $ref: "#/components/responses/Error"
  /batch-generations/{batch_id}:
    get:
      operationId: getBatchGeneration
      tags: [tasks]
      x-rbac: user
      parameters:
        - $ref: "#/components/parameters/BatchGenerationId"
      responses:
        "200":
          description: Tenant-scoped batch generation request and child task projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGenerationRequest"
        default:
          $ref: "#/components/responses/Error"
  /batch-generations/{batch_id}/children:
    get:
      operationId: listBatchGenerationChildren
      tags: [tasks]
      x-rbac: user
      parameters:
        - $ref: "#/components/parameters/BatchGenerationId"
      responses:
        "200":
          description: Child tasks for a tenant-scoped batch generation request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationChildTaskPage"
        default:
          $ref: "#/components/responses/Error"
  /batch-generations/{batch_id}/progress:
    get:
      operationId: getBatchGenerationProgress
      tags: [tasks]
      x-rbac: user
      parameters:
        - $ref: "#/components/parameters/BatchGenerationId"
      responses:
        "200":
          description: Aggregated batch progress for polling UI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchProgress"
        default:
          $ref: "#/components/responses/Error"
  /batch-generations/{batch_id}/cancel:
    post:
      operationId: cancelBatchGeneration
      tags: [tasks]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/BatchGenerationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Batch cancellation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGenerationRequest"
        default:
          $ref: "#/components/responses/Error"
  /batch-generation-children/{child_id}/retry:
    post:
      operationId: retryBatchGenerationChild
      tags: [tasks]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/GenerationChildTaskId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Retried child task, queued for worker execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationChildTask"
        default:
          $ref: "#/components/responses/Error"
  /batch-generations/queue-runtime:
    get:
      operationId: listAdminBatchQueueRuntime
      tags: [tasks]
      x-rbac: admin
      parameters:
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Read-only admin batch queue runtime projection for worker claim leases, provider strategy groups, quota, retry, and drain review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBatchQueueRuntimePage"
        default:
          $ref: "#/components/responses/Error"
  /batch-generation-children:
    get:
      operationId: listAdminBatchGenerationChildren
      tags: [tasks]
      x-rbac: admin
      parameters:
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Read-only admin child task projection with claim, retry, dead-letter, quota, result, trace, and provider usage linkage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBatchChildTaskPage"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/candidate-sets:
    get:
      operationId: listCandidateSets
      tags: [candidates]
      x-rbac: user
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/StatusFilter"
      responses:
        "200":
          description: Candidate set page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateSetPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCandidateSet
      tags: [candidates]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateSetCreate"
      responses:
        "202":
          description: Candidate generation task accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatus"
        default:
          $ref: "#/components/responses/Error"
  /candidate-sets/{candidate_set_id}/assets:
    get:
      operationId: listCandidateAssets
      tags: [candidates]
      x-rbac: user
      parameters:
        - $ref: "#/components/parameters/CandidateSetId"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Candidate asset page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateAssetPage"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/selected-direction:
    put:
      operationId: selectDirection
      tags: [candidates]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectedDirectionCreate"
      responses:
        "200":
          description: Selected direction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectedDirection"
        default:
          $ref: "#/components/responses/Error"
  /workspaces/{workspace_id}/canvas/nodes:
    get:
      operationId: listCanvasNodes
      tags: [canvas]
      x-rbac: user
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Canvas node page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasNodePage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCanvasNode
      tags: [canvas]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanvasNodeCreate"
      responses:
        "201":
          description: Canvas node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasNode"
        default:
          $ref: "#/components/responses/Error"
  /workspaces/{workspace_id}/canvas/frames:
    get:
      operationId: listCanvasFrames
      tags: [canvas]
      x-rbac: user
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Canvas frame page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasFramePage"
        default:
          $ref: "#/components/responses/Error"
  /workspaces/{workspace_id}/canvas/versions:
    get:
      operationId: listCanvasVersions
      tags: [canvas]
      x-rbac: user
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Canvas version page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasVersionPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCanvasVersion
      tags: [canvas]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanvasVersionCreate"
      responses:
        "201":
          description: Canvas version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasVersion"
        default:
          $ref: "#/components/responses/Error"
  /uploads:
    post:
      operationId: createUpload
      tags: [assets]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCreate"
      responses:
        "201":
          description: Upload request and object metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        default:
          $ref: "#/components/responses/Error"
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      x-rbac: user
      parameters:
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Asset page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetPage"
        default:
          $ref: "#/components/responses/Error"
  /assets/library:
    get:
      operationId: listAssetLibrary
      tags: [assets]
      x-rbac: user
      parameters:
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/ProjectIdQuery"
      responses:
        "200":
          description: Tenant-scoped asset library entries available for prompt attachment, canvas insertion, favorite/archive, and cross-project reuse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetLibraryEntryPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAssetLibraryEntry
      tags: [assets]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetLibraryEntryCreate"
      responses:
        "201":
          description: Created tenant-scoped asset library entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetLibraryEntry"
        default:
          $ref: "#/components/responses/Error"
  /assets/library/{entry_id}:
    patch:
      operationId: updateAssetLibraryEntry
      tags: [assets]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/AssetLibraryEntryId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetLibraryEntryUpdate"
      responses:
        "200":
          description: Updated tenant-scoped asset library entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetLibraryEntry"
        default:
          $ref: "#/components/responses/Error"
  /brand-kits:
    get:
      operationId: listBrandKits
      tags: [brand-kits]
      x-rbac: user
      parameters:
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/ProjectIdQuery"
      responses:
        "200":
          description: Tenant-scoped Brand Kits with logo asset refs, palette, fonts, guidelines, source refs, and project bindings for prompt context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKitPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createBrandKit
      tags: [brand-kits]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandKitCreate"
      responses:
        "201":
          description: Created tenant-scoped Brand Kit projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKit"
        default:
          $ref: "#/components/responses/Error"
  /brand-kits/{brand_kit_id}:
    patch:
      operationId: updateBrandKit
      tags: [brand-kits]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/BrandKitId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandKitUpdate"
      responses:
        "200":
          description: Updated tenant-scoped Brand Kit projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKit"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/brand-kit-default:
    get:
      operationId: getProjectDefaultBrandKit
      tags: [brand-kits]
      x-rbac: user
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project default Brand Kit projection for prompt context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKit"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: setProjectDefaultBrandKit
      tags: [brand-kits]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectDefaultBrandKitSet"
      responses:
        "200":
          description: Updated project default Brand Kit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKit"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/packages:
    get:
      operationId: listPackages
      tags: [packages]
      x-rbac: user
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Package page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackagePage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createPackage
      tags: [packages]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageCreate"
      responses:
        "201":
          description: Package.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Package"
        default:
          $ref: "#/components/responses/Error"
  /packages/{package_id}/exports:
    post:
      operationId: createExport
      tags: [packages]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/PackageId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportCreate"
      responses:
        "202":
          description: Export task accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatus"
        default:
          $ref: "#/components/responses/Error"
  /exports/{export_id}:
    get:
      operationId: getExport
      tags: [packages]

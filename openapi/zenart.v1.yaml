        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAccount
      tags: [auth]
      x-rbac: user
      x-idempotency-required: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:

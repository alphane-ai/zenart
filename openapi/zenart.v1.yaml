          type: string
          minLength: 1
          description: Non-secret operator rationale recorded in cleanup audit metadata.
        mode:
          type: string
          description: Optional smoke compatibility mode; endpoint route determines the actual cleanup mode.
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
        dry_run:
          type: boolean
          default: false
        second_reviewer_id:
          type: string
          description: Required for destructive cleanup runs and must differ from the acting admin.
        second_reviewer_role:
          type: string
          description: Role for the second reviewer; must authorize object retention cleanup.
        second_review_rationale:
          type: string
          description: Non-secret second-review rationale required for destructive cleanup runs.

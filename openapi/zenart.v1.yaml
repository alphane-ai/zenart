components:
  securitySchemes:
    ZenariSession:
      type: apiKey
      in: header
      name: X-Zenari-User-ID
      description: Stage 0 local session header. Production auth must replace this with signed session validation.
  parameters:
    PageToken:
      name: page_token
      in: query
      schema:
        type: string
      description: Cursor token returned by the previous page.
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Maximum records to return.
    Sort:
      name: sort
      in: query
      schema:
        type: string
        example: "-created_at"
      description: Comma-separated sort keys. Prefix with - for descending.
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 200
      description: Search text applied to indexed text fields.
    StatusFilter:
      name: status
      in: query
      schema:
        type: string
      description: Filter by resource status.
    TenantIdFilter:
      name: tenant_id
      in: query
      required: true
      schema:
        type: string
      description: Required admin tenant scope for stored eval result reads.
    EvalSuiteIdFilter:
      name: eval_suite_id
      in: query
      schema:
        type: string
      description: Filter eval results by suite id.
    EvalSubjectTypeFilter:
      name: subject_type
      in: query
      schema:
        type: string
        enum: [skill_version, prompt_fragment, prompt_mutation, meta_prompt, image_spec, vertical_workflow_pack]
      description: Filter eval results by evaluated subject type.
    SubjectIdFilter:
      name: subject_id
      in: query
      schema:
        type: string
      description: Filter eval results by evaluated subject id.
    SubjectVersionFilter:
      name: subject_version
      in: query
      schema:
        type: string
      description: Filter eval results by evaluated subject version before latest-only grouping.
    CompletedAfterFilter:
      name: completed_after
      in: query
      schema:
        type: string
        format: date-time
      description: Return eval results completed after this timestamp.
    EvalLatestOnlyFilter:
      name: latest_only
      in: query
      schema:
        type: boolean
        default: false
      description: Return only the latest immutable eval result per tenant, suite, subject, version, and runner hash.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
      description: Required for mutating requests so retries are safe.
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
    ProjectIdQuery:
      name: project_id
      in: query
      schema:
        type: string
      description: Optional user project scope for tenant-safe reusable assets or Brand Kits.
    AssetLibraryEntryId:
      name: entry_id
      in: path
      required: true
      schema:
        type: string
      description: Asset library entry identifier scoped to the authenticated tenant.
    BrandKitId:
      name: brand_kit_id
      in: path
      required: true
      schema:
        type: string
      description: Brand Kit identifier scoped to the authenticated tenant.
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
    ChatSessionId:
      name: chat_session_id
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
    BatchGenerationId:
      name: batch_id
      in: path
      required: true
      schema:
        type: string
    GenerationChildTaskId:
      name: child_id
      in: path
      required: true
      schema:
        type: string
    CandidateSetId:
      name: candidate_set_id
      in: path
      required: true
      schema:
        type: string
    PackageId:
      name: package_id
      in: path
      required: true
      schema:
        type: string
    ExportId:
      name: export_id
      in: path
      required: true
      schema:
        type: string
    TeamId:
      name: team_id
      in: path
      required: true
      schema:
        type: string
      description: Team identifier scoped to the authenticated tenant.
    TeamInviteId:
      name: invite_id
      in: path
      required: true
      schema:
        type: string
      description: Team invite identifier scoped to the authenticated tenant and team.
    TeamMemberId:
      name: member_id
      in: path
      required: true
      schema:
        type: string
      description: Team member identifier scoped to the authenticated tenant and team.
    SkillId:
      name: skill_id
      in: path
      required: true
      schema:
        type: string
    CrawlerSourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
      description: Crawler source identifier scoped to the authenticated admin tenant.
    TraceId:
      name: trace_id
      in: path
      required: true
      schema:
        type: string
    EvalResultId:
      name: result_id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Shared error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorEnvelope:
      type: object
      required: [code, message, request_id, taxonomy, retryable, blocked, details, field_errors]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        taxonomy:
          $ref: "#/components/schemas/ErrorTaxonomy"
        retryable:
          type: boolean
        blocked:
          type: boolean
        details:
          type: object
          additionalProperties: true
        field_errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    ErrorTaxonomy:
      type: object
      required: [category, retryable, blocked, user_actionable]
      properties:
        category:
          type: string
          enum: [validation, auth, forbidden, not_found, conflict, retryable, blocked, quota_insufficient, provider_unavailable, review_required, internal]
        retryable:
          type: boolean
        blocked:
          type: boolean
        user_actionable:
          type: boolean
    Team:
      type: object
      required: [id, tenant_id, name, plan_id, seat_limit, created_at]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        plan_id:
          type: string
        seat_limit:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    TeamMember:
      type: object
      required: [id, team_id, tenant_id, user_id, email, role, status, created_at, updated_at]
      properties:
        id:
          type: string
        team_id:
          type: string
        tenant_id:
          type: string
        user_id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, admin, member]
        status:
          type: string
          enum: [active, invited, removed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TeamInvite:
      type: object
      required: [id, team_id, tenant_id, email, role, idempotency_key, invited_by, expires_at, created_at]
      properties:
        id:
          type: string
        team_id:
          type: string
        tenant_id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member]
        idempotency_key:
          type: string
        invited_by:
          type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    TeamSeatUsage:
      type: object
      required: [team_id, tenant_id, plan_id, seat_limit, active_seats, invited_seats, billable_seats, available_seats]
      properties:
        team_id:
          type: string
        tenant_id:
          type: string
        plan_id:
          type: string
        seat_limit:
          type: integer
          minimum: 0
        active_seats:
          type: integer
          minimum: 0
        invited_seats:
          type: integer
          minimum: 0
          description: Pending invites reserve billable seats.
        billable_seats:
          type: integer
          minimum: 0
          description: Active plus invited seats counted for billing and entitlement.
        available_seats:
          type: integer
          minimum: 0
    TeamSeatEntitlement:
      type: object
      required: [allowed, reason, usage]
      properties:
        allowed:
          type: boolean
        reason:
          type: string
          enum: [ok, seat_limit_exceeded]
        usage:
          $ref: "#/components/schemas/TeamSeatUsage"
    AdminTeamCreate:
      type: object
      required: [id, name, plan_id, seat_limit, owner_user_id, owner_email, rationale]
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
        plan_id:
          type: string
        seat_limit:
          type: integer
          minimum: 1
        owner_user_id:
          type: string
        owner_email:
          type: string
          format: email
        rationale:
          type: string
          minLength: 1
          description: Non-secret admin rationale recorded in audit.
        metadata:
          type: object
          additionalProperties: true
    AdminTeamInviteCreate:
      type: object
      required: [email, role, rationale]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member]
        expires_at:
          type: string
          format: date-time
        rationale:
          type: string
          minLength: 1
          description: Non-secret admin rationale recorded in audit.
        metadata:
          type: object
          additionalProperties: true
    AdminTeamMemberRemove:
      type: object
      required: [rationale]
      properties:
        rationale:
          type: string
          minLength: 1
          description: Non-secret admin rationale recorded in audit.
        metadata:
          type: object
          additionalProperties: true
    AdminTeamMemberRemoveResult:
      type: object
      required: [team_id, tenant_id, member_id, removed_by, removed]
      properties:
        team_id:
          type: string
        tenant_id:
          type: string
        member_id:
          type: string
        removed_by:
          type: string
        removed:
          type: boolean
    TeamBillingLink:
      type: object
      required:
        - tenant_id
        - team_id
        - provider
        - provider_subscription_id
        - provider_subscription_item_id
        - proration_behavior
        - status
        - metadata
        - created_at
        - updated_at
      properties:
        tenant_id:
          type: string
        team_id:
          type: string
        provider:
          type: string
          enum: [stripe, mock]
        provider_subscription_id:
          type: string
          description: Provider subscription reference; raw API keys are never accepted or returned.
        provider_subscription_item_id:
          type: string
          description: Stripe subscription item whose quantity mirrors billable team seats.
        price_id:
          type: string
        proration_behavior:
          type: string
          enum: [create_prorations, none, always_invoice]
        status:
          type: string
          enum: [active, paused, removed]
        metadata:
          type: object
          additionalProperties: true
          description: Public-safe audit metadata; raw secrets are redacted before persistence.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TeamBillingLinkUpsert:
      type: object
      required: [provider_subscription_id, provider_subscription_item_id, rationale]
      properties:
        provider:
          type: string
          enum: [stripe, mock]
          default: stripe
        provider_subscription_id:
          type: string
        provider_subscription_item_id:
          type: string
        price_id:
          type: string
        proration_behavior:
          type: string
          enum: [create_prorations, none, always_invoice]
          default: create_prorations
        status:
          type: string
          enum: [active, paused, removed]
          default: active
        rationale:
          type: string
          minLength: 1
          description: Non-secret admin rationale recorded before mutation.
        metadata:
          type: object
          additionalProperties: true
          description: Public-safe audit metadata; raw secrets are rejected or redacted before audit/persistence.
    TeamSeatSync:
      type: object
      required:
        - id
        - tenant_id
        - team_id
        - provider
        - requested_quantity
        - synced_quantity
